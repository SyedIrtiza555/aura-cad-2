[package]
name = "aura-desk"
version = "1.0.0"
description = "Aura Desk - High-Performance Jewelry CAD & Custom Order Management Platform"
authors = ["Syed Irtiza"]
license = "MIT"
repository = "https://github.com/SyedIrtiza555/aura-cad-2"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2.13.3"
tauri-plugin-process = "2.4.0"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-notification = "2.6.0"
tauri-plugin-clipboard-manager = "2.4.2"
